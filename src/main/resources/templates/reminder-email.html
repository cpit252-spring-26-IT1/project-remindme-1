<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .card { background: #ffffff; border-radius: 8px; padding: 30px; max-width: 500px; margin: auto; }
        .header { background-color: #e53935; color: white; padding: 16px; border-radius: 8px 8px 0 0; text-align: center; }
        .body { padding: 20px 0; color: #333; }
        .label { color: #888; font-size: 12px; }
        .value { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        .days-badge { background-color: #e53935; color: white; border-radius: 50px; padding: 8px 20px; font-size: 20px; font-weight: bold; display: inline-block; margin: 10px 0; }
        .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h2>Document Expiry Reminder</h2>
    </div>
    <div class="body">
        <p>Hello <strong th:text="${ownerName}"></strong>,</p>
        <p>This is a reminder that the following document is expiring soon:</p>

        <div class="label">Document Name</div>
        <div class="value" th:text="${documentName}"></div>

        <div class="label">Expiry Date</div>
        <div class="value" th:text="${expiryDate}"></div>

        <div class="label">Days Remaining</div>
        <div class="days-badge" th:text="${daysLeft} + ' days'"></div>

        <p>Please renew your document before it expires.</p>
    </div>
    <div class="footer">RemindMe &mdash; Never let a document expire again.</div>
</div>
</body>
</html>
