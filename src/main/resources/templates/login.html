<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RemindMe | Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .auth-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card p-5">
                <h3 class="text-center fw-bold mb-4" id="authTitle">Welcome Back</h3>
                <form id="authForm">
                    <div class="mb-3 d-none" id="nameGroup">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="authName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" id="authEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="authPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" id="authBtn">Login</button>
                    <p class="text-center mt-3 small">
                        <span id="toggleText">New here?</span> <a href="#" id="toggleAuth">Create an account</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const form = document.getElementById('authForm');
    const toggleLink = document.getElementById('toggleAuth');
    let isLogin = true;

    toggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        document.getElementById('nameGroup').classList.toggle('d-none', isLogin);
        document.getElementById('authTitle').innerText = isLogin ? 'Welcome Back' : 'Create Account';
        document.getElementById('authBtn').innerText = isLogin ? 'Login' : 'Sign Up';
        document.getElementById('toggleText').innerText = isLogin ? 'New here?' : 'Already have an account?';
        toggleLink.innerText = isLogin ? 'Create an account' : 'Login here';
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const url = isLogin ? '/api/auth/login' : '/api/auth/signup';
        const body = {
            email: document.getElementById('authEmail').value,
            password: document.getElementById('authPassword').value,
            name: isLogin ? null : document.getElementById('authName').value
        };

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                if (isLogin) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    alert('Registration successful! Please log in.');
                    location.reload();
                }
            } else {
                alert(data.message || 'Authentication failed');
            }
        });
    });
</script>
</body>
</html>
